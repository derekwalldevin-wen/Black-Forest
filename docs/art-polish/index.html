<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑森林 · 补充美术实景</title>
<style>body{margin:0;background:#12101a;color:#e8dcc0;font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:22px;color:#d5b76c}a{color:#e3bf6d}nav{display:flex;gap:24px;flex-wrap:wrap}.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.item{text-align:center;background:#211b2a;border:1px solid #504035;border-radius:12px;padding:14px}.item img{width:112px;height:112px;object-fit:contain}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.shot{background:#211b2a;padding:12px;border-radius:12px}.shot img{display:block;width:100%;height:auto}.note{color:#bbab93}#error{color:#f08080}</style>
<main><h1>黑森林 · 新增美术与实景</h1><p>14 件遗物、2 枚妖契徽记、16 个战斗图标，已用于实际奖励、战斗、事件和点击说明。文字与数值来自游戏。</p><nav><a href="../../index.html?artpolish=20261011">进入游戏</a><a href="../ui-reference/runtime/index.html">全套 UI 对照</a><a href="REPORT.md">接入与验收报告</a></nav><h2>物品与妖契</h2><div id="items" class="icons"></div><h2>战斗语义图标</h2><div id="tactical" class="icons"></div><h2>实际游戏画面</h2><p class="note">战斗截图包含同时显示 14 件遗物、多种状态的边界检查。物品奖励逐一覆盖全部 14 件遗物。</p><div id="shots" class="shots"></div><p id="error"></p></main>
<script>
const labels={wolf_totem:'狼牙图腾',iron_ring:'铁誓指环',moon_lens:'月透镜',blood_stone:'血石',thorn_charm:'荆棘护符',marrow_vial:'骨髓药瓶',whetstone:'磨刃石',hunter_charm:'猎人护符',bone_totem:'骸骨图腾',bronze_mask:'青铜面具',cinnabar_seal:'朱砂印',thunder_bi:'雷纹璧',unquenched_ember:'不灭火种',bone_urn:'骨瓮',huodou:'祸斗契',huodou_yu:'祸斗·墟契',attack:'攻击',defend:'防御',strength:'力量',vulnerable:'易伤',weak:'虚弱',frail:'脆弱',poison:'中毒／施毒',burn:'灼烧',thorns:'尖刺',burnDmg:'燎原／循火',drain:'吸血',heal:'治疗',buff:'强化',debuff:'削弱',spirit:'灵韵',power:'能力'};
const scenes={'combat-gothic':'哥特战斗 · 多状态检查','combat-shanhai':'山海战斗 · 多状态检查','contract-gothic':'哥特 · 妖契说明','contract-shanhai':'山海 · 妖契说明','status-gothic':'哥特 · 状态说明','status-shanhai':'山海 · 状态说明','intent-details':'混合敌人意图明细','intent-catalog':'九类敌人意图','event-relic-tip':'事件遗物说明'};
Promise.all([fetch('ASSETS.json').then(r=>r.json()),fetch('BROWSER-REPORT.json').then(r=>r.json())]).then(([assets,report])=>{
 for(const a of assets){const c=document.createElement('div');c.className='item';const img=document.createElement('img');img.src='../../'+a.file;img.alt=labels[a.id];const title=document.createElement('div');title.textContent=labels[a.id];c.append(img,title);document.getElementById(a.kind==='tactical'?'tactical':'items').append(c);}
 for(const file of report.screens){const c=document.createElement('div');c.className='shot';const title=document.createElement('div');const id=file.replace('.png','');title.textContent=scenes[id]||(id.startsWith('reward-relics-')?'遗物奖励 · 第 '+Number(id.slice(-2))+' 组':id);const a=document.createElement('a');a.href=file;const img=document.createElement('img');img.src=file;img.alt=title.textContent;img.loading='lazy';a.append(img);c.append(title,a);document.getElementById('shots').append(c);}
}).catch(e=>document.getElementById('error').textContent='加载报告失败：'+e.message);
</script></html>
