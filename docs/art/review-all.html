<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>黑森林 · 全量美术画册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12101a;color:#e8dcc0;font:15px/1.6 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px}h1,h2{color:#c8a86a}h1{font-size:28px}h2{font-size:21px;margin-top:32px}p{color:#aaa1b3}button,select{background:#1e1928;color:#e8dcc0;border:1px solid #4a3f5e;padding:8px 12px;border-radius:4px;margin:3px;cursor:pointer}button[aria-pressed=true]{border-color:#c8a86a;color:#c8a86a}a{color:#c8a86a}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.grid.paired{grid-template-columns:repeat(3,minmax(0,1fr))}figure{margin:0;min-width:0}figcaption{font-size:13px;color:#c8a86a;margin:6px 0 12px}img{display:block;width:100%;object-fit:cover;object-position:center;aspect-ratio:var(--ratio,1.5)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}.label{font-size:12px;color:#93879e}.small img{width:103px;margin:auto}.enemies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.enemies img{object-fit:contain;aspect-ratio:1;background:repeating-conic-gradient(#252031 0% 25%,#1b1724 0% 50%) 50%/22px 22px}.backs{display:flex;gap:24px}.backs figure{width:180px}.backs img{aspect-ratio:2/3}.game{display:flex;gap:24px;flex-wrap:wrap}.game iframe{width:360px;height:640px;border:1px solid #4a3f5e;background:#12101a}.game aside{max-width:550px}.missing{aspect-ratio:1.5;display:grid;place-items:center;background:#1e1928;color:#93879e}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.paired{grid-template-columns:repeat(2,minmax(0,1fr))}.enemies{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.paired{grid-template-columns:1fr}.enemies{grid-template-columns:1fr}.game iframe{max-width:100%}}
</style>
<main><h1>黑森林 · 全量美术画册</h1><p id="summary">正在装订画册…</p>
<h2>卡面插画</h2><nav id="realms"><button data-world="gothic" aria-pressed="false">哥特篇</button><button data-world="shanhai" aria-pressed="false">山海篇</button><button data-world="paired" aria-pressed="true">逐张对照</button></nav>
<nav id="ratios"><button data-ratio="1.21" aria-pressed="false">最窄画窗 1.21:1</button><button data-ratio="1.5" aria-pressed="true">原图 3:2</button><button data-ratio="1.85" aria-pressed="false">最宽画窗 1.85:1</button><button id="small" aria-pressed="false">103 px 缩略图</button></nav>
<p>同一主体在两境域中保持构图一致。切换画窗可检查居中裁切与轮廓辨识度。</p><section id="cards" class="grid paired"></section>
<h2>立绘 · BOSS / 精英 / 关键敌人</h2><p>透明棋盘格只用于预览。点击“进入战斗”查看敌人和卡牌在实际游戏中的效果。</p><section id="enemies" class="enemies"></section>
<h2>卡背</h2><section id="backs" class="backs"></section>
<h2>游戏实景</h2><div class="game"><iframe id="game" title="黑森林战斗实景"></iframe><aside><label>境域 <select id="game-world"><option value="gothic">哥特</option><option value="shanhai">山海</option></select></label><label>敌人 <select id="game-enemy"></select></label><p><a id="game-link" target="_blank">单独打开游戏</a> · <a id="off-link" target="_blank">关闭插画对照</a></p><p>原图、生成提示词、旧立绘备份与检查结果随项目保存。此画册显示的是实际接入游戏的导出文件。</p></aside></div>
</main><script>
const labels={sword:'剑',shield:'盾',dagger:'匕首',blood:'血',moon:'月',venom:'毒镖',fang:'獠牙',thorns:'荆棘',spark:'链火',talisman:'符纸',thunder:'雷纹',ring:'玉环',cloud:'瘴气',lens:'晶镜',eye:'异眼',gem:'金石',vial:'酒器',lotus:'莲花'};
const enemyNames={'dijiang':'帝江','forest-lord':'黑暗森林之主','alpha-wolf':'头狼','bog-witch':'沼泽女巫','qiongqi':'穷奇','huodou':'祸斗','xiangliu':'相柳','taotie':'饕餮','baize':'白泽'};
let manifest,records,world='paired';
const asset=name=>records.find(record=>record.name===name);
const image=(name,label)=>{const item=asset(name);return item?`<img src="../../assets/${item.runtimeName||item.name}" alt="${label}">`:`<div class="missing">待装订</div>`};
function cards(){document.querySelector('#cards').classList.toggle('paired',world==='paired');document.querySelector('#cards').innerHTML=manifest.keys.map(key=>world==='paired'?`<figure><div class="pair"><div>${image(`art-gothic-${key}.png`,labels[key]+'哥特')}<span class="label">哥特</span></div><div>${image(`art-shanhai-${key}.png`,labels[key]+'山海')}<span class="label">山海</span></div></div><figcaption>${labels[key]} · ${key}</figcaption></figure>`:`<figure>${image(`art-${world}-${key}.png`,labels[key])}<figcaption>${labels[key]} · ${key}</figcaption></figure>`).join('');}
function game(){const realm=document.querySelector('#game-world').value,id=document.querySelector('#game-enemy').value;const params=new URLSearchParams({debug:'1',auto:'1',chapter:realm==='shanhai'?'3':'0',enemy:id.replaceAll('-','_'),cards:realm==='shanhai'?'fu_paper,thunder_word,nine_head,xuan_ji,strike':'strike,defend,focus,blood_pact,quick_jab'});const url='../../index.html?'+params;document.querySelector('#game').src=url;document.querySelector('#game-link').href=url;document.querySelector('#off-link').href=url+'&art=off';}
Promise.all([fetch('production.json').then(r=>r.json()),fetch('export-report.json').then(r=>r.json())]).then(([m,r])=>{manifest=m;records=r;document.querySelector('#summary').textContent=`${r.filter(x=>x.kind==='card').length} 张卡面 · ${r.filter(x=>x.kind==='enemy').length} 张立绘 · ${r.filter(x=>x.kind==='card-back').length} 张卡背`;cards();document.querySelector('#enemies').innerHTML=m.enemies.map(id=>`<figure>${image(`enemy-${id}.png`,enemyNames[id])}<figcaption>${enemyNames[id]} · <button data-enemy="${id}">进入战斗</button></figcaption></figure>`).join('');document.querySelector('#backs').innerHTML=m.cardBacks.map(realm=>`<figure>${image(`card-back-${realm}.png`,realm+'卡背')}<figcaption>${realm==='gothic'?'哥特':'山海'}卡背</figcaption></figure>`).join('');document.querySelector('#game-enemy').innerHTML=m.enemies.map(id=>`<option value="${id}">${enemyNames[id]}</option>`).join('');document.querySelector('#game-enemy').value='forest-lord';game();document.querySelectorAll('[data-enemy]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#game-world').value=['forest-lord','alpha-wolf','bog-witch'].includes(button.dataset.enemy)?'gothic':'shanhai';document.querySelector('#game-enemy').value=button.dataset.enemy;game();document.querySelector('#game').scrollIntoView({behavior:'smooth'});}));});
document.querySelectorAll('[data-world]').forEach(button=>button.addEventListener('click',()=>{world=button.dataset.world;document.querySelectorAll('[data-world]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));cards();}));
document.querySelectorAll('[data-ratio]').forEach(button=>button.addEventListener('click',()=>{document.documentElement.style.setProperty('--ratio',button.dataset.ratio);document.querySelectorAll('[data-ratio]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));
document.querySelector('#small').addEventListener('click',event=>{const active=document.querySelector('#cards').classList.toggle('small');event.target.setAttribute('aria-pressed',String(active));});
document.querySelector('#game-world').addEventListener('change',game);document.querySelector('#game-enemy').addEventListener('change',game);
</script></html>
