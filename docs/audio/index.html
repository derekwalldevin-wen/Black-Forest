<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑森林 · 音效试听</title>
<style>body{margin:0;background:#12101a;color:#eadcc5;font:16px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}h1{font-size:28px;color:#d5b36d}a{color:#d5b36d}p{color:#b9ac99}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{padding:18px;background:#211b29;border:1px solid #675337;border-radius:12px}h2{font-size:19px;margin:0 0 8px}audio{width:100%;height:42px}small{display:block;color:#ac9d90;margin-top:8px}img{width:100%;max-width:320px;border:1px solid #675337;margin:12px}</style></head>
<body><main><h1>黑森林 · 音效试听</h1><p>17 个原创合成音效已接入实际游戏。游戏默认音量为 55%，不同事件再按各自响度混音；下方可单独试听原始文件。</p><p><a href="../../index.html?story=on&amp;v=20261012-audio">进入游戏</a> · 在顶部行囊中打开「声音设置」，调整音量或静音。设置自动保存。</p><div id="sounds" class="grid"></div><h1>声音设置实景</h1><img src="settings-390.png" alt="390宽声音设置"><img src="settings-320.png" alt="320宽声音设置"><p><a href="REPORT.md">接入与验收记录</a> · <a href="ASSETS.json">素材来源、参数与哈希</a></p></main>
<script>const labels={event_enter:['进入事件','低声木铃与悬疑泛音'],event_choice:['确认抉择','纸页与短促双音'],relic:['获得遗物','逐级展开的金属泛音'],ui:['界面确认','柔和的短木铃'],select:['选中卡牌','轻纸张声'],play:['提交出牌','略重的纸张掠动'],deny:['资源不足','两次低音提示'],attack:['敌人挥击','短促风声，先于命中'],impact:['敌人受伤','低频冲击与干脆的接触声'],block:['盾牌吸收伤害','短金属碰撞'],guard:['获得格挡','护盾升起的泛音'],hurt:['我方掉血','偏低、偏重的冲击'],heal:['实际回血','逐级上升的铃音'],turn:['结束回合','双音木击'],victory:['战斗胜利','短上行收束'],defeat:['战败','缓慢下行收束'],ending:['抵达结局','稍长的归途铃音']};fetch('ASSETS.json').then(r=>r.json()).then(m=>{for(const a of m.assets){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),audio=document.createElement('audio'),small=document.createElement('small');h.textContent=labels[a.id][0];p.textContent=labels[a.id][1];audio.controls=true;audio.preload='none';audio.src='../../'+a.file;audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(o=>{if(o!==audio)o.pause();}));small.textContent=a.duration+' 秒 · 游戏混音系数 '+a.gain;card.append(h,p,audio,small);document.querySelector('#sounds').append(card);}}).catch(()=>document.querySelector('#sounds').textContent='素材清单读取失败，请通过本地服务器打开。');</script></body></html>
