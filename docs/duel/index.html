<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑森林 · 左右对战验收</title><style>body{background:#12101a;color:#e8dcc0;max-width:1300px;margin:30px auto;padding:0 16px;font:16px system-ui}a{color:#88cfe3}p{line-height:1.7}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}article{padding:12px;background:#201d28;border:1px solid #8c723c;border-radius:12px}img{width:100%;height:auto}button{background:#453923;color:#fff1cd;border:1px solid #b08d3f;padding:12px;margin:6px;cursor:pointer}h1{font-size:28px}</style><h1>左右对战 · 主角与敌人相向</h1><p>主角在左、敌人在右，共用站立基线。9 套新生成关键帧已接入，其余沿用经审核的原有动作并统一朝向。点击按钮查看实际攻击命中画面。</p><p><a href="../../index.html?duel=1">进入游戏</a> · <a href="REVIEW.md">美术取舍与验收</a> · <a href="PROMPTS.json">完整生图提示词</a></p><div id="grid"></div><script>fetch('BROWSER-REPORT.json').then(r=>r.json()).then(r=>{for(const e of r.checks){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=e.id;const img=document.createElement('img');img.src=e.id+'-ready.png';img.alt=e.id+' 对战实景';a.append(h,img);for(const [key,label] of [['ready','待机'],['attack','攻击命中']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>img.src=e.id+'-'+key+'.png';a.append(b);}document.querySelector('#grid').append(a);}});</script></html>
