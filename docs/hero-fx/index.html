<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提灯旅人 · 招式帧</title><style>body{margin:0;background:#12101a;color:#eaddc4;font:16px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1060px;margin:auto;padding:28px 18px}a{color:#d1ae65}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}article{background:#211b2b;border:1px solid #685538;border-radius:14px;padding:18px}h2{font-size:21px;margin-top:0}canvas{max-width:100%;display:block;margin:auto;background:radial-gradient(ellipse at center,#34303b,#17131e)}.sheet{width:100%;background:#23202b;border-radius:8px}.shot{width:calc(100% - 20px);max-width:320px;margin:10px;border:1px solid #79603c}p{color:#bbae98}button{padding:12px 18px;background:#403125;color:#eed6a3;border:1px solid #967039;border-radius:8px;font:inherit;cursor:pointer}</style></head><body><main><h1>提灯旅人 · 招式与透明动画帧</h1><p>真实生成的动作与特效帧，按出牌类型在游戏中播放。灯刃、红线法印与护佑光均使用独立透明序列，数值结算沿用原规则。</p><p><a href="../../index.html?story=on&amp;v=20261012-hero-fx">进入正式游戏</a> · <a href="PROMPTS.json">内置生图提示词</a> · <a href="ASSET-AUDIT.json">素材清单</a> · <a href="REPORT.md">接入说明</a></p><button id="toggle">暂停帧预览</button><div id="assets" class="grid"></div><h1>实际游戏截图</h1><div id="screens"></div></main><script>
const labels={'lantern-blade':'金色灯刃','thread-seal':'朱砂红线法印','lantern-ward':'提灯护佑光','hero-actions':'提灯旅人施招姿态'};let playing=true,t=0,last=0,items=[];document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停帧预览':'继续帧预览';};
fetch('ASSET-AUDIT.json').then(r=>r.json()).then(a=>{for(const p of a.assets){const card=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas'),img=document.createElement('img'),note=document.createElement('p');h.textContent=labels[p.id];canvas.width=canvas.height=320;img.src='../../'+p.file;img.className='sheet';img.alt=h.textContent+'完整透明帧图';note.textContent=p.frames.length+' 个独立生成帧 · '+Math.round(p.bytes/1024)+' KB';const source=new Image();source.src=img.src;items.push({canvas,source,hero:p.id==='hero-actions',columns:p.columns,poses:p.poses});card.append(h,canvas,note,img);document.querySelector('#assets').append(card);}}).catch(()=>document.querySelector('#assets').textContent='正在准备素材清单。');
fetch('BROWSER-REPORT.json').then(r=>r.json()).then(r=>{for(const name of r.screens){const img=new Image();img.src=name;img.alt=name;img.className='shot';document.querySelector('#screens').append(img);}});
function animate(now){if(playing)t+=Math.min(100,now-last);last=now;for(const i of items){if(!i.source.complete||!i.source.naturalWidth)continue;const cell=i.source.naturalWidth/i.columns,p=i.poses,sequence=i.hero?[p.ready,p.windup,p.attack,p.recover,p.ready,p.windup,p.cast,p.recover,p.ready,p.guard,p.guard,p.recover]:null,frame=i.hero?sequence[Math.floor(t/110)%sequence.length]:Math.floor(t/80)%6,ctx=i.canvas.getContext('2d');ctx.clearRect(0,0,320,320);ctx.drawImage(i.source,frame%i.columns*cell,Math.floor(frame/i.columns)*cell,cell,cell,0,0,320,320);}requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
