<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提灯旅人 · 新版战斗 UI</title>
<style>body{margin:0;background:#12101a;color:#e8dcc0;font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:22px}h1{font-size:30px}h2{font-size:22px;color:#d5b76c}a{color:#e6c477}nav{display:flex;flex-wrap:wrap;gap:20px}.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}.heroes figure{margin:0;background:#1b1723;border:1px solid #594936;border-radius:14px;padding:18px;text-align:center}.heroes img{height:400px;max-width:100%;object-fit:contain}.heroes .avatar{height:280px;margin-top:60px;margin-bottom:60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}article{padding:12px;background:#1d1825;border:1px solid #4a3a30;border-radius:12px}article img{width:100%;height:auto;display:block}article h3{font-size:17px;margin:0 0 12px}.note{color:#bba992}#error{color:#f08080}</style>
<main><h1>提灯旅人 · 战斗体验调整</h1><p>人类主角、单一菜单入口与两种资源刻度牌已用于真实游戏。顶部让出敌人和意图的空间，底部突出出牌所需资源与结束回合。</p><nav><a href="../../index.html?hero-ui=20261011">进入新版游戏</a><a href="DESIGN-REPORT.md">设计与验收说明</a><a href="../ui-reference/runtime/index.html">历史参考与当前实景</a></nav><h2>同一位旅人</h2><div class="heroes"><figure><img src="../../assets/ui/hero-traveler-v1.webp" alt="提灯旅人完整立绘"><figcaption>靛蓝斗篷 · 青铜护符 · 暖色提灯</figcaption></figure><figure><img class="avatar" src="../../assets/ui/hero-avatar-v1.png" alt="提灯旅人头像"><figcaption>战斗、行囊与存档页使用同身份头像</figcaption></figure></div><h2>实际游戏画面</h2><p class="note">包含普通与符箓构筑、390/320 宽度、资源耗尽、菜单，以及 14 件遗物和 2 份妖契的完整四页行囊。内容与数字来自运行中的 Phaser 场景。</p><div class="grid" id="grid"></div><p id="error"></p></main>
<script>
function title(id){if(id==='title-traveler')return '首次进入 · 提灯旅人';if(id==='title-save')return '存档入口 · 人类头像';if(id==='many-relics')return '多遗物汇总 · 顶栏留白';if(id.startsWith('inventory-'))return '完整行囊 · 第 '+id.slice(-1)+' 页';const parts=id.split('-'),kind={combat:'战斗',menu:'菜单与暂停',depleted:'资源耗尽'}[parts[0]];return kind+' · '+parts[1]+' 宽度 · '+(parts[2]==='shanhai'?'山海篇':'黑森林');}
fetch('BROWSER-REPORT.json').then(r=>r.json()).then(report=>{for(const file of report.screens){const a=document.createElement('article'),h=document.createElement('h3'),link=document.createElement('a'),img=document.createElement('img');h.textContent=title(file.replace('.png',''));link.href=file;img.src=file;img.alt=h.textContent;img.loading='lazy';link.append(img);a.append(h,link);document.getElementById('grid').append(a);}}).catch(e=>document.getElementById('error').textContent='加载实景报告失败：'+e.message);
</script></html>
