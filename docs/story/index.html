<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>没有署名的家书 · 黑森林剧情</title>
<style>body{margin:0;background:#12101a;color:#e8dcc0;font:16px/1.8 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:22px}h1{font-size:30px}h2{font-size:22px;color:#d5b76c}a{color:#e5c578}nav{display:flex;gap:22px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}article,details{background:#1d1825;border:1px solid #594936;border-radius:12px;padding:14px}article img{width:100%;display:block;border-radius:6px}article h3{font-size:18px}p{margin:8px 0}details{margin:12px 0}summary{cursor:pointer;color:#d9ba79}.muted{color:#bba992}#error{color:#ef8e9c}</style>
<main><h1>没有署名的家书</h1><p>母亲的名字从家书上消失。提灯旅人循着一根红线，穿过黑森林和青铜之墟，寻找让所有人回家的办法。</p><nav><a href="../../index.html?story=on">开始或继续游戏</a><a href="DESIGN.md">设计与接入说明</a><a href="../../index.html?debug=1&auto=1&story=on">第一战剧情体验</a></nav><p class="muted" id="status"></p><h2>六章与两种归途</h2><div class="grid" id="art"></div><details><summary>展开完整 18 战剧本与选择（含结局信息）</summary><div id="script"></div></details><h2>实际游戏画面</h2><p class="muted">真实场景截图覆盖战前、战后、选择、两种结局、手记与 320 宽度。阅读可以略过，重要选择需要明确作答。</p><div class="grid" id="screens"></div><p id="error"></p></main>
<script>
function card(parent,title,src,text){const a=document.createElement('article'),h=document.createElement('h3'),link=document.createElement('a'),img=document.createElement('img');h.textContent=title;img.src=src;img.alt=title;img.loading='lazy';link.href=src;link.append(img);a.append(h,link);if(text){const p=document.createElement('p');p.textContent=text;a.append(p)}parent.append(a)}
fetch('PREVIEW.json').then(r=>{if(!r.ok)throw Error('预览清单未就绪');return r.json()}).then(content=>{
 const assets=content.assets;document.getElementById('status').textContent=content.note;
 const names={'ending-home':'众灯归乡','ending-watch':'送灯的人'};
 for(const a of assets){const c=content.chapters.find(c=>c.art===a.key);card(document.getElementById('art'),c?.title||names[a.key],'../../'+a.file,c?.summary||'不同的选择，通往不同的归途。')}
 content.beats.forEach((b,i)=>{const d=document.createElement('details'),s=document.createElement('summary');s.textContent=(i+1)+' · '+b.title;d.append(s);for(const kind of ['before','after'])for(const [speaker,text] of b[kind]){const p=document.createElement('p');p.textContent=(kind==='before'?'战前':'战后')+' · '+speaker+'：'+text;d.append(p)}if(b.choice){const c=content.choices[b.choice];for(const o of c.options){const p=document.createElement('p');p.textContent='选择：'+o.label+' → '+o.echo;d.append(p)}}document.getElementById('script').append(d)});
 for(const file of content.screens)card(document.getElementById('screens'),file.replace('.png',''),file);
}).catch(e=>document.getElementById('error').textContent='加载失败：'+e.message);
</script></html>
