<script>
let version='new';const $=id=>document.getElementById(id);
function update(){const view=$('viewport'),lang=$('locale'),prefix=version==='new'?'v2/':'';const src=prefix+'evidence/'+view.value+'-'+lang.value+'.webp';$('capture').src=src;$('capture-link').href=src;$('caption').textContent='02 · '+(version==='new'?'本轮还原':'上一版')+' · '+view.selectedOptions[0].text+' · '+lang.selectedOptions[0].text;$('compare').classList.toggle('desktop',view.value.startsWith('1280')||view.value.startsWith('1366'));for(const id of ['new','old'])$(id).setAttribute('aria-pressed',String(id===version));}
for(const id of ['new','old'])$(id).onclick=()=>{version=id;update();};$('viewport').onchange=update;$('locale').onchange=update;
