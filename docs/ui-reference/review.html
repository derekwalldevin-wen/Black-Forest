<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑森林全界面参考</title>
<style>body{margin:24px;background:#12101a;color:#e8dcc0;font:16px/1.6 system-ui}h1,a{color:#b08d3f}button,select{padding:12px;background:#282132;color:#e8dcc0;border:1px solid #b08d3f;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;margin-top:24px}.card{padding:16px;border:1px solid #51452e;border-radius:12px}.card img{width:100%;cursor:zoom-in}.card h2{font-size:20px}.card p{font-size:14px}.pending{aspect-ratio:9/16;display:grid;place-content:center;background:#191520;color:#958972}dialog{background:#12101a;color:#e8dcc0;max-width:95vw;max-height:95vh}dialog img{max-height:80vh;max-width:85vw}dialog::backdrop{background:#000c}</style>
<h1>黑森林 · 全界面参考</h1><p>46项参考图已完成。参考图展示布局与风格，实际文案、数值和规则以源码为准；3项建议新增已单独标注。</p><p><a href="COMPLETION-AUDIT.md">完成验收与交接</a> · <a href="DESIGN-BRIEF.md">统一规范</a> · <a href="SCREEN-SPECS.md">逐屏设计说明</a> · <a href="CODE-TEXT-MISMATCHES.md">文案与行为差异</a> · <a href="SCREENS.json">制作清单</a></p><select id="filter"><option value="all">全部</option><option value="ready">已有参考图</option><option value="pending">待生成</option><option value="proposed">建议新增</option></select> <span id="total"></span><div id="grid" class="grid"></div><dialog id="preview"><button id="dismiss">关闭</button><p id="caption"></p><img id="full"></dialog>
<script>const $=id=>document.getElementById(id);let data=[];const labels={'reference-ready':'构图可用','draft-needs-review':'初稿待修订','pending':'待生成'};function render(){$('grid').replaceChildren();$('total').textContent=`共 ${data.length} 项，已有图 ${data.filter(s=>s.status!=='pending').length} 张`;for(const s of data){const f=$('filter').value;if(f==='ready'&&s.status==='pending'||f==='pending'&&s.status!=='pending'||f==='proposed'&&s.scope!=='proposed')continue;const a=document.createElement('article');a.className='card';const h=document.createElement('h2');h.textContent=s.title;a.append(h);const p=document.createElement('p');p.textContent=(s.scope==='proposed'?'建议新增':'当前已有')+' · '+labels[s.status];a.append(p);if(s.status==='pending'){const d=document.createElement('div');d.className='pending';d.textContent='待生成参考图';a.append(d)}else{const i=document.createElement('img');i.src=s.image;i.alt=s.title;i.loading='lazy';i.onclick=()=>{$('full').src=s.image;$('caption').textContent=s.title;$('preview').showModal()};a.append(i)}const n=document.createElement('p');n.textContent=s.source+(s.note?' · '+s.note:'');a.append(n);$('grid').append(a)}}$('filter').onchange=render;$('dismiss').onclick=()=>$('preview').close();fetch('SCREENS.json').then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>{$('total').textContent='请通过本地游戏服务器打开本页。'});</script></html>
