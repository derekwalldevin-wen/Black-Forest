<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑森林 · 参考与实际游戏对照</title>
<style>body{background:#12101a;color:#e8dcc0;font:16px/1.6 system-ui;margin:24px}h1,a{color:#c8a86a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}article{padding:16px;border:1px solid #635135;border-radius:12px}.pair{display:flex;gap:8px}.pair>div{width:50%}img{width:100%;display:block}h2{font-size:20px}button{padding:12px;background:#3c2833;color:#e8dcc0;border:1px solid #c8a86a}dialog{background:#12101a;color:#e8dcc0;max-width:95vw;max-height:95vh}dialog img{width:auto;max-width:85vw;max-height:80vh}</style>
<style>.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.pair>div{flex:1;min-width:0;width:auto}@media(max-width:600px){body{margin:12px}}</style>
<h1>参考图与实际游戏对照</h1><p>左侧保留原参考设计，右侧为真实 Phaser 游戏截图。最新实现已引入人类主角、单一菜单入口与资源刻度牌；旧参考中的骷髅与导航布局用于历史对照。</p><p><a href="../../../index.html?hero-ui=20261011">进入游戏</a> · <a href="../../hero-ui/index.html">主角与新 UI 实景</a> · <a href="IMPLEMENTATION-PLAN.md">完整接入范围</a> · <a href="RUNTIME-COVERAGE.json">运行时核对记录</a></p><div class="grid" id="grid"></div><dialog id="zoom"><button onclick="document.getElementById('zoom').close()">关闭</button><img id="large"></dialog>
<script>Promise.all([fetch('../SCREENS.json').then(r=>r.json()),fetch('RUNTIME-COVERAGE.json').then(r=>r.json())]).then(([refs,report])=>{for(const ref of refs){const state=report.results.find(s=>s.id===ref.id),a=document.createElement('article'),h=document.createElement('h2');h.textContent=ref.title;a.append(h);const pair=document.createElement('div');pair.className='pair';for(const [label,path]of [['参考','../'+ref.image],['实际',state.runtime]]){const box=document.createElement('div'),p=document.createElement('p'),img=document.createElement('img');p.textContent=label;img.src=path;img.loading='lazy';img.onclick=()=>{document.getElementById('large').src=path;document.getElementById('zoom').showModal()};box.append(p,img);pair.append(box)}a.append(pair);document.getElementById('grid').append(a)}});</script></html>
