<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>提灯旅人 · 资源与菜单美术</title><style>body{background:#12101a;color:#e8dcc0;font:16px system-ui;margin:24px auto;max-width:1000px;padding:0 16px}h1{font-size:26px}a{color:#88cfe3}.icons{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;background:#24222c;padding:12px;border:1px solid #77623b;border-radius:12px;text-align:center}.icons img{width:112px;height:112px}.shots{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px}.shots img{width:min(100%,390px);height:auto}p{line-height:1.7}</style><h1>提灯旅人 · 资源与菜单美术</h1><p>蓝色提灯代表行动力，琥珀火焰代表灵韵。菜单采用行囊、卡牌、地图与手记图标。插画来自 AI 生图，中文与实时数值由游戏绘制。</p><p><a href="../../index.html">进入游戏</a> · <a href="PROMPTS.json">完整生成提示词</a> · <a href="REPORT.json">实测记录</a></p><div class="icons" id="icons"></div><div class="shots"><img src="combat-390-5.png" alt="山海战斗双资源"><img src="menu-390-0.png" alt="新版行囊菜单"></div><script>for(const [id,name] of [['energy','行动力'],['spirit','灵韵'],['menu','行囊'],['deck','牌组'],['route','征途'],['journal','手记']]){const f=document.createElement('figure');f.innerHTML=`<img src="../../assets/ui/refined-${id}-v1.png" alt="${name}"><figcaption>${name}</figcaption>`;document.getElementById('icons').append(f);}</script></html>
